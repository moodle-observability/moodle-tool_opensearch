apiVersion: 1

datasources:
  # Moodle log written by logstore_opensearch (data streams <prefix>-logstore).
  - name: OpenSearch (Moodle log)
    uid: opensearch-moodle
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: true
    jsonData:
      database: "*-logstore*"
      timeField: "@timestamp"
      flavor: opensearch
      version: "2.19.3"
      maxConcurrentShardRequests: 5
      pplEnabled: true
