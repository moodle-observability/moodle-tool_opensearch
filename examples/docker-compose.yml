# Example: OpenSearch, OpenSearch Dashboards and Grafana for tool_opensearch (tests only).
#
# Moodle joins the "opensearch" network and sends to http://opensearch:9200:
#
#   networks:
#     opensearch:
#       external: true
#
# Or, for a running container: docker network connect opensearch <container>
#
# Tests only: security plugin disabled, anonymous Grafana Admin. Never expose these ports.
#
# Usage: docker compose up -d, then import opensearch-dashboards/moodle-log.ndjson in
# OpenSearch Dashboards (Dashboards Management > Saved objects > Import). Grafana loads its
# datasource and dashboard from grafana/ on start.

name: opensearch

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.3
    container_name: opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"   # API: http://localhost:9200
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - opensearch
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.3
    container_name: opensearch-dashboards
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"   # UI: http://localhost:5601
    networks:
      - opensearch
    depends_on:
      opensearch:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.3.1
    container_name: opensearch-grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_PLUGINS_PREINSTALL=grafana-opensearch-datasource@2.34.7
    ports:
      - "3001:3000"   # UI: http://localhost:3001
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - opensearch
    depends_on:
      opensearch:
        condition: service_healthy

networks:
  opensearch:
    name: opensearch

volumes:
  opensearch_data:
  grafana_data:
